name: Android Scanner APK

on:
  push:
    branches: ["**"]
    paths:
      - "scanner/**"
      - ".github/workflows/scanner-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-scanner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installable scanner APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          cache: true

      # Android requires every update to have the same signature. Keeping the
      # generated testing key in Actions cache lets a newer workflow APK install
      # directly over the previous one instead of forcing an uninstall.
      - name: Restore scanner signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: openote-scanner-signing-v1

      - name: Create scanner signing key when needed
        shell: bash
        run: |
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Openote Scanner,OU=Openote,O=Openote,L=Local,C=DE"
          fi

      - name: Install Android 36 platform
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Get scanner packages
        working-directory: scanner
        run: flutter pub get

      - name: Build APK
        working-directory: scanner
        run: flutter build apk --release

      - name: Give the APK a stable name
        run: cp scanner/build/app/outputs/flutter-apk/app-release.apk openote-scanner.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openote-scanner-apk
          path: openote-scanner.apk
          if-no-files-found: error
          compression-level: 0
