name: Automated tests

# Run beside the release build. A red test result stays visible in Actions but
# never delays or blocks creation of the Windows installer.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openote-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Full Windows tests
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Test version calculation
        run: ./packaging/windows/release-version.test.ps1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/onote_core
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          cache: true
          # Cargokit's symlink resolver cannot traverse hidden AppData folders.
          pub-cache-path: '${{ runner.temp }}/openote-pub-cache'

      - name: Test Rust core
        working-directory: rust/onote_core
        run: cargo test --all-targets
      - name: Check Rust warnings
        working-directory: rust/onote_core
        run: cargo clippy -p onote_core --all-targets -- -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Check Rust licenses
        working-directory: rust/onote_core
        run: cargo deny check licenses
      - name: Build Rust core for Flutter tests
        working-directory: rust/onote_core
        run: cargo build --release

      - name: Resolve Flutter packages
        working-directory: app
        run: flutter pub get
      - name: Analyze Flutter
        working-directory: app
        run: flutter analyze --no-fatal-infos
      - name: Remove desktop-unused web assets
        working-directory: app
        shell: pwsh
        run: |
          dart run pdfrx:remove_wasm_modules
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dart run tool/strip_web_assets.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Native storage/import tests require the SQLite and Rust DLLs staged by
      # a desktop build. Debug is sufficient and faster than another release.
      - name: Build Windows test runtime
        working-directory: app
        run: flutter build windows --debug
      - name: Test Flutter
        working-directory: app
        env:
          CI: 'true'
        run: flutter test --reporter github
