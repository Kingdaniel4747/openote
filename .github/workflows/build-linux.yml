name: Build Linux package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Test build version (X.Y.Z); does not publish a release"
        required: true
        default: '0.8.0'
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

env:
  BUILD_VERSION: ${{ inputs.version }}

jobs:
  linux:
    name: Build Linux DEB and RPM (x64)
    runs-on: ubuntu-24.04
    # Keep the glibc baseline and libmpv.so.2 ABI used by the packages.
    container: debian:12
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Linux build and packaging tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git unzip xz-utils zip jq \
            build-essential clang cmake ninja-build pkg-config \
            libgtk-3-dev libstdc++-12-dev liblzma-dev libmpv-dev \
            libepoxy-dev libsecret-1-dev libssl-dev \
            rpm file binutils desktop-file-utils shared-mime-info nodejs

      - name: Check out the source
        uses: actions/checkout@v6

      - name: Validate build version
        shell: bash
        run: bash .github/scripts/validate-build-version.sh

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          cache: true

      - name: Trust the cached Flutter SDK in the container
        run: git config --global --add safe.directory "$FLUTTER_ROOT"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Get Flutter packages
        working-directory: app
        run: flutter pub get

      - name: Trim unused package assets
        working-directory: app
        run: |
          dart run pdfrx:remove_wasm_modules
          dart run tool/strip_web_assets.dart

      - name: Build the Linux app and OneNote importer
        working-directory: app
        run: flutter build linux --release --build-name=$BUILD_VERSION --dart-define=OPENOTE_VERSION=$BUILD_VERSION --dart-define=OPENOTE_REPOSITORY=Kingdaniel4747/openote

      - name: Trim Material icon font
        working-directory: app
        run: dart run tool/shake_icons.dart linux

      - name: Verify shared-library dependencies
        run: bash packaging/linux/verify-bundle.sh app/build/linux/x64/release/bundle

      - name: Test Linux packaging with real package builders
        env:
          OPENOTE_LINUX_PACKAGE_TESTS: '1'
        run: node --test .github/scripts/linux-package.test.mjs

      - name: Build and inspect Linux packages
        run: |
          desktop-file-validate packaging/linux/org.openote.openote.desktop
          bash packaging/linux/build-packages.sh "$BUILD_VERSION" app/build/linux/x64/release/bundle
          dpkg-deb --info "openote-$BUILD_VERSION-linux-amd64.deb"
          rpm --query --package --info "openote-$BUILD_VERSION-linux-x86_64.rpm"

      - name: Upload Linux packages
        uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: |
            openote-${{ inputs.version }}-linux-amd64.deb
            openote-${{ inputs.version }}-linux-x86_64.rpm
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
