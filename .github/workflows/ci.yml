name: Windows checks and installer

# Reused by Release; no second automatic multi-platform run on each push.
on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
        required: false
      version:
        type: string
        default: ''
        required: false
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test version calculation
        run: ./packaging/windows/release-version.test.ps1

      - name: Read and check version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pubspec = Get-Content app/pubspec.yaml -Raw
          if ($pubspec -notmatch '(?m)^version:\s*(\d+\.\d+\.\d+)') { throw 'Missing app version' }
          $version = $Matches[1]
          if ($env:PUBLISH -eq 'true') {
            . ./packaging/windows/release-version.ps1
            $tags = @(git tag --list 'v*')
            if ($LASTEXITCODE -ne 0) { throw 'Cannot read version tags' }
            $headTags = @(git tag --points-at HEAD --list 'v*' |
              Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } |
              Sort-Object { [version]($_ -replace '^v','') })
            if ($headTags.Count) {
              # Re-running the same commit rebuilds the same version.
              $version = $headTags[-1] -replace '^v',''
            } else {
              $version = Get-NextOpenoteVersion -Baseline $version -Tags $tags
            }
          } elseif ($env:INPUT_VERSION) {
            $requested = $env:INPUT_VERSION -replace '^v',''
            if ($requested -ne $version) { throw "Version must match pubspec.yaml ($version)" }
          }
          "VERSION=$version" >> $env:GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/onote_core
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          cache: true
          # Cargokit's symlink resolver cannot traverse hidden AppData folders.
          pub-cache-path: '${{ runner.temp }}/openote-pub-cache'

      - name: Test Rust core
        working-directory: rust/onote_core
        run: cargo test --all-targets
      - name: Check Rust warnings
        working-directory: rust/onote_core
        run: cargo clippy -p onote_core --all-targets -- -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Core stays permissive
        working-directory: rust/onote_core
        run: cargo deny check licenses
      - name: Build Rust core
        working-directory: rust/onote_core
        run: cargo build --release

      - name: Resolve Flutter packages
        working-directory: app
        run: flutter pub get
      - name: Analyze
        working-directory: app
        run: flutter analyze --no-fatal-infos
      - name: Remove desktop-unused web assets
        working-directory: app
        shell: pwsh
        run: |
          dart run pdfrx:remove_wasm_modules
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dart run tool/strip_web_assets.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Keep the video DLLs inside the installer: no separate engine ZIP or
      # first-use download is needed for this Windows build.
      - name: Build Windows
        working-directory: app
        run: flutter build windows --release --build-name=$env:VERSION --dart-define=OPENOTE_VERSION=$env:VERSION --dart-define=OPENOTE_REPOSITORY=$env:GITHUB_REPOSITORY
      - name: Trim icon font
        working-directory: app
        run: dart run tool/shake_icons.dart windows

      # Build first: storage/import tests need the bundled SQLite + Rust DLLs.
      - name: Test Flutter
        working-directory: app
        env:
          CI: 'true'
        run: flutter test --reporter github

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Package setup EXE
        shell: pwsh
        run: ./packaging/windows/build-installer.ps1 -Version $env:VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: openote-*-windows-x64-setup.exe
          if-no-files-found: error


      - name: Publish versioned Windows release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "v$env:VERSION"
          # Fail on API/auth errors, never mistake them for an absent release.
          $releases = gh api --paginate "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect existing releases' }
          if ($tag -in @($releases)) {
            Write-Host "$tag already exists; leaving it unchanged."
            exit 0
          }
          $installer = "openote-$env:VERSION-windows-x64-setup.exe"
          if (-not (Test-Path -LiteralPath $installer)) { throw 'Installer is missing' }
          $notes = "Windows build from commit $env:GITHUB_SHA. Includes the setup EXE; source code is available with this tag."
          gh release create $tag $installer --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Openote $env:VERSION" --notes $notes --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
