name: Windows checks and installer

# Reused by Release; no second automatic multi-platform run on each push.
on:
  workflow_call:
    inputs:
      version:
        type: string
        default: ''
        required: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Read and check version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pubspec = Get-Content app/pubspec.yaml -Raw
          if ($pubspec -notmatch '(?m)^version:\s*(\d+\.\d+\.\d+)') { throw 'Missing app version' }
          $version = $Matches[1]
          $requested = $env:INPUT_VERSION -replace '^v', ''
          if (-not $requested -and $env:GITHUB_REF_TYPE -eq 'tag') {
            $requested = $env:GITHUB_REF_NAME -replace '^v', ''
          }
          if ($requested -and $requested -ne $version) { throw "Version must match pubspec.yaml ($version)" }
          "VERSION=$version" >> $env:GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/onote_core
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          cache: true

      - name: Test Rust core
        working-directory: rust/onote_core
        run: cargo test --all-targets
      - name: Check Rust warnings
        working-directory: rust/onote_core
        run: cargo clippy -p onote_core --all-targets -- -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Core stays permissive
        working-directory: rust/onote_core
        run: cargo deny check licenses
      - name: Build Rust core
        working-directory: rust/onote_core
        run: cargo build --release

      - name: Resolve Flutter packages
        working-directory: app
        run: flutter pub get
      - name: Analyze
        working-directory: app
        run: flutter analyze --no-fatal-infos
      - name: Remove desktop-unused web assets
        working-directory: app
        shell: pwsh
        run: |
          dart run pdfrx:remove_wasm_modules
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dart run tool/strip_web_assets.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Keep the video DLLs inside the installer: no separate engine ZIP or
      # first-use download is needed for this Windows build.
      - name: Build Windows
        working-directory: app
        run: flutter build windows --release --build-name=$env:VERSION
      - name: Trim icon font
        working-directory: app
        run: dart run tool/shake_icons.dart windows

      # Build first: storage/import tests need the bundled SQLite + Rust DLLs.
      - name: Test Flutter
        working-directory: app
        env:
          CI: 'true'
        run: flutter test --reporter github

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Package setup EXE
        shell: pwsh
        run: ./packaging/windows/build-installer.ps1 -Version $env:VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: openote-*-windows-x64-setup.exe
          if-no-files-found: error
