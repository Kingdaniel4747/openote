name: Windows Release

# A push creates one installable Windows release. Checks and tests are
# deliberately separate, so they never delay the EXE.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    name: Build Windows EXE and publish release
    runs-on: windows-latest

    steps:
      - name: Check out the source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Choose the next version
        id: version
        shell: pwsh
        run: |
          . "$env:GITHUB_WORKSPACE\packaging\windows\release-version.ps1"
          $baseline = (Select-String -LiteralPath "$env:GITHUB_WORKSPACE\app\pubspec.yaml" -Pattern '^version:\s*([^+\s]+)' | Select-Object -First 1).Matches.Groups[1].Value
          $tags = @(git tag --list 'v*')
          $version = Get-NextOpenoteVersion -Baseline $baseline -Tags $tags
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Get Flutter packages
        working-directory: app
        run: flutter pub get

      - name: Build the Windows app
        working-directory: app
        env:
          OPENOTE_VERSION: ${{ steps.version.outputs.version }}
        run: flutter build windows --release --build-name=${{ steps.version.outputs.version }}

      - name: Install the installer builder
        shell: pwsh
        run: |
          choco install innosetup --no-progress --yes

      - name: Build the Windows installer
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\packaging\windows\build-installer.ps1" -Version '${{ steps.version.outputs.version }}'

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Openote Windows v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: openote-${{ steps.version.outputs.version }}-windows-x64-setup.exe
