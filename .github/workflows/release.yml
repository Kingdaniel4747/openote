name: Openote Release

# A push creates one release containing the Windows installer and Android
# scanner APK. Checks and tests remain separate from packaging.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: openote-release
  cancel-in-progress: false

jobs:
  release:
    name: Build Windows installer and Android scanner
    runs-on: windows-latest

    steps:
      - name: Check out the source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Choose the next version
        id: version
        shell: pwsh
        run: |
          . "$env:GITHUB_WORKSPACE\packaging\windows\release-version.ps1"
          $baseline = (Select-String -LiteralPath "$env:GITHUB_WORKSPACE\app\pubspec.yaml" -Pattern '^version:\s*([^+\s]+)' | Select-Object -First 1).Matches.Groups[1].Value
          $tags = @(git tag --list 'v*')
          $version = Get-NextOpenoteVersion -Baseline $baseline -Tags $tags
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Get Flutter packages
        working-directory: app
        run: flutter pub get

      - name: Build the Windows app
        working-directory: app
        # `String.fromEnvironment` reads Dart defines, not Windows environment
        # variables. Passing this explicitly makes the installed app report its
        # real release version to the in-app updater instead of always 0.8.0.
        run: flutter build windows --release --build-name=${{ steps.version.outputs.version }} --dart-define=OPENOTE_VERSION=${{ steps.version.outputs.version }} --dart-define=OPENOTE_REPOSITORY=Kingdaniel4747/openote

      - name: Install the installer builder
        shell: pwsh
        run: |
          choco install innosetup --no-progress --yes

      - name: Build the Windows installer
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\packaging\windows\build-installer.ps1" -Version '${{ steps.version.outputs.version }}'

      - name: Set up Java for Android
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Restore scanner signing key
        uses: actions/cache@v5
        with:
          path: ~/.android/debug.keystore
          key: openote-scanner-signing-v1

      - name: Create scanner signing key when needed
        shell: pwsh
        run: |
          $key = Join-Path $HOME '.android\debug.keystore'
          if (-not (Test-Path -LiteralPath $key)) {
            New-Item -ItemType Directory -Force -Path (Split-Path $key) | Out-Null
            & keytool -genkeypair -v -keystore $key -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Openote Scanner,OU=Openote,O=Openote,L=Local,C=DE'
          }

      - name: Install Android 36 platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Get scanner packages
        working-directory: scanner
        run: flutter pub get

      - name: Build Android scanner APK
        working-directory: scanner
        run: flutter build apk --release --build-name=${{ steps.version.outputs.version }} --build-number=${{ github.run_number }}

      - name: Name the scanner APK
        shell: pwsh
        run: Copy-Item -LiteralPath 'scanner\build\app\outputs\flutter-apk\app-release.apk' -Destination 'openote-scanner-${{ steps.version.outputs.version }}.apk'

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Openote v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            openote-${{ steps.version.outputs.version }}-windows-x64-setup.exe
            openote-scanner-${{ steps.version.outputs.version }}.apk
