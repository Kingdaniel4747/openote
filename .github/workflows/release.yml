name: Release packages

# Every pushed change creates a numbered release draft. The jobs are globally
# serialized so two near-simultaneous pushes cannot choose the same version.
on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      version:
        description: "Optional X.Y.Z override; leave empty to use the next patch version"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: openote-release
  cancel-in-progress: false

jobs:
  version:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.release-version.outputs.value }}
    steps:
      - name: Check out tags for version calculation
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Choose and validate the version
        id: release-version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          version="${REQUESTED_VERSION#v}"
          if [[ -z "$version" ]]; then
            baseline="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' app/pubspec.yaml | head -n 1)"
            if [[ ! "$baseline" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "app/pubspec.yaml has no valid X.Y.Z baseline version" >&2
              exit 1
            fi
            highest="$(printf '%s\n' "$baseline"; git tag -l 'v*' | sed -nE 's/^v([0-9]+\.[0-9]+\.[0-9]+)$/\1/p')"
            version="$(printf '%s\n' "$highest" | sort -V | tail -n 1)"
            IFS='.' read -r major minor patch <<< "$version"
            if (( patch >= 65535 )); then
              patch=0
              ((minor++))
            else
              ((patch++))
            fi
            if (( minor > 65535 )); then
              minor=0
              ((major++))
            fi
            if (( major > 65535 )); then
              echo "Windows version range exhausted" >&2
              exit 1
            fi
            version="$major.$minor.$patch"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must be X.Y.Z; got: $REQUESTED_VERSION" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

  windows:
    name: Build Windows installer
    needs: version
    runs-on: windows-latest
    steps:
      - name: Check out the source
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Get Flutter packages
        working-directory: app
        run: flutter pub get

      - name: Trim unused package assets
        working-directory: app
        shell: pwsh
        run: |
          dart run pdfrx:remove_wasm_modules
          dart run tool/strip_web_assets.dart

      - name: Build the Windows app
        working-directory: app
        run: flutter build windows --release --build-name=${{ needs.version.outputs.value }} --dart-define=OPENOTE_VERSION=${{ needs.version.outputs.value }} --dart-define=OPENOTE_REPOSITORY=Kingdaniel4747/openote

      - name: Trim Material icon font
        working-directory: app
        shell: pwsh
        run: dart run tool/shake_icons.dart windows

      - name: Install the installer builder
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build the Windows installer
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\packaging\windows\build-installer.ps1" -Version '${{ needs.version.outputs.value }}'

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: openote-${{ needs.version.outputs.value }}-windows-x64-setup.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  android:
    name: Build Android scanner APK
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: scanner/android/**/*.gradle*

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Configure the protected Android signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "Missing Android signing secrets. See scanner/README.md before releasing." >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > scanner/android/app/openote-release.jks
          cat > scanner/android/key.properties <<EOF
          storeFile=openote-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Get scanner packages
        working-directory: scanner
        run: flutter pub get

      - name: Build scanner APK
        working-directory: scanner
        run: flutter build apk --release --build-name=${{ needs.version.outputs.value }} --build-number=${{ github.run_number }}

      - name: Name scanner APK
        run: cp scanner/build/app/outputs/flutter-apk/app-release.apk openote-scanner-${{ needs.version.outputs.value }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: openote-scanner-${{ needs.version.outputs.value }}.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Create draft GitHub release
    needs: [version, windows, android]
    runs-on: ubuntu-latest
    steps:
      - name: Download installer and APK
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-files
          merge-multiple: true

      - name: Verify packages
        shell: bash
        run: |
          test -s "release-files/openote-${{ needs.version.outputs.value }}-windows-x64-setup.exe"
          test -s "release-files/openote-scanner-${{ needs.version.outputs.value }}.apk"

      - name: Create the draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          name: Openote v${{ needs.version.outputs.value }}
          draft: true
          generate_release_notes: true
          files: |
            release-files/openote-${{ needs.version.outputs.value }}-windows-x64-setup.exe
            release-files/openote-scanner-${{ needs.version.outputs.value }}.apk
